<svg viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background screen glow -->
  <circle cx="250" cy="200" r="140" fill="#1C1C7B" fill-opacity="0.02" />

  <!-- Main Desktop Frame -->
  <rect x="70" y="50" width="360" height="240" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8" />
  <rect x="70" y="50" width="360" height="40" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
  <!-- Browser Controls -->
  <circle cx="95" cy="70" r="5" fill="#EF4444" />
  <circle cx="110" cy="70" r="5" fill="#F59E0B" />
  <circle cx="125" cy="70" r="5" fill="#10B981" />
  <rect x="150" y="60" width="200" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Mockup Dashboard Layout -->
  <!-- Sidebar -->
  <rect x="78" y="98" width="64" height="184" fill="#1C1C7B" rx="8" />
  <rect x="86" y="112" width="48" height="8" rx="4" fill="#FFFFFF" opacity="0.6" />
  <rect x="86" y="132" width="48" height="8" rx="4" fill="#FFFFFF" opacity="0.3" />
  <rect x="86" y="152" width="48" height="8" rx="4" fill="#FFFFFF" opacity="0.3" />
  <rect x="86" y="172" width="48" height="8" rx="4" fill="#FFFFFF" opacity="0.3" />
  <rect x="86" y="192" width="48" height="8" rx="4" fill="#FFFFFF" opacity="0.3" />

  <!-- Main Dashboard Mockup Contents -->
  <!-- Card 1 (Progress Circle) -->
  <rect x="156" y="110" width="124" height="76" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="168" y="124" width="64" height="8" rx="4" fill="#1C1C7B" />
  <rect x="168" y="140" width="40" height="6" rx="3" fill="#64748B" />
  <circle cx="248" cy="148" r="18" stroke="#E2E8F0" stroke-width="4" fill="none" />
  <path d="M248 130A18 18 0 0 1 266 148" stroke="#FF8C00" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Card 2 (Activity Chart) -->
  <rect x="294" y="110" width="124" height="76" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="306" y="124" width="50" height="8" rx="4" fill="#1C1C7B" />
  <rect x="306" y="140" width="70" height="6" rx="3" fill="#64748B" />
  <path d="M306 170L326 156L346 164L366 148L386 158" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="366" cy="148" r="3" fill="#16A34A" />

  <!-- Bottom Row: Course listings -->
  <rect x="156" y="200" width="262" height="82" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="168" y="214" width="100" height="8" rx="4" fill="#1C1C7B" />
  <rect x="168" y="228" width="180" height="6" rx="3" fill="#E2E8F0" />
  <rect x="168" y="240" width="140" height="6" rx="3" fill="#E2E8F0" />
  <rect x="168" y="258" width="238" height="8" rx="4" fill="#E2E8F0" />
  <rect x="168" y="258" width="180" height="8" rx="4" fill="#FF8C00" />

  <!-- Floating Elements -->
  <!-- Student avatar 1 -->
  <g transform="translate(30, 210)">
    <circle cx="28" cy="28" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="28" cy="20" r="10" fill="#1D4ED8" fill-opacity="0.1" />
    <path d="M16 38C16 31.3726 21.3726 26 28 26C34.6274 26 40 31.3726 40 38" fill="#1D4ED8" fill-opacity="0.1" />
    <circle cx="44" cy="14" r="8" fill="#16A34A" />
    <path d="M41.5 14L43.5 16L46.5 12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating Certificate Card -->
  <g transform="translate(350, 160)" class="filter drop-shadow-md">
    <rect width="110" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="12" y="12" width="86" height="40" rx="4" fill="#FFF4E6" />
    <path d="M55 20L61 24L59 31L49 27" stroke="#FF8C00" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Tiny lines in card -->
    <rect x="12" y="60" width="50" height="5" rx="2.5" fill="#1C1C7B" />
    <rect x="12" y="68" width="30" height="4" rx="2" fill="#64748B" />
    <!-- Star medal -->
    <circle cx="85" cy="40" r="8" fill="#FF8C00" />
    <polygon points="85,36 87,40 91,40 88,42 89,46 85,44 81,46 82,42 79,40 83,40" fill="#FFFFFF" />
  </g>

  <!-- Floating Graduation Hat -->
  <g transform="translate(380, 20)">
    <circle cx="24" cy="24" r="28" fill="#E8E8FF" />
    <path d="M24 14L37 19.5L24 25L11 19.5L24 14Z" fill="#1C1C7B" />
    <path d="M15.5 22.5V26.5C15.5 28.5 24 29.5 24 26.5V22.5" stroke="#1C1C7B" stroke-width="2" stroke-linecap="round" />
    <path d="M33 21V27" stroke="#FF8C00" stroke-width="2" stroke-linecap="round" />
    <circle cx="33" cy="28.5" r="1.5" fill="#FF8C00" />
  </g>
</svg>
