<svg viewBox="0 0 500 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shapes -->
  <circle cx="250" cy="160" r="120" fill="#FF8C00" fill-opacity="0.03" />
  <rect x="80" y="40" width="340" height="240" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Mockup review card -->
  <g transform="translate(130, 90)">
    <rect width="240" height="140" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Star Row -->
    <g transform="translate(20, 20)">
      <polygon points="10,0 13,7 20,7 15,11 17,18 10,14 3,18 5,11 0,7 7,7" fill="#FF8C00" />
      <polygon points="32,0 35,7 42,7 37,11 39,18 32,14 25,18 27,11 22,7 29,7" fill="#FF8C00" />
      <polygon points="54,0 57,7 64,7 59,11 61,18 54,14 47,18 49,11 44,7 51,7" fill="#FF8C00" />
      <polygon points="76,0 79,7 86,7 81,11 83,18 76,14 69,18 71,11 66,7 73,7" fill="#FF8C00" />
      <polygon points="98,0 101,7 108,7 103,11 105,18 98,14 91,18 93,11 88,7 95,7" fill="#FF8C00" />
    </g>
    <!-- Review lines -->
    <rect x="20" y="55" width="200" height="8" rx="4" fill="#1C1C7B" fill-opacity="0.9" />
    <rect x="20" y="75" width="160" height="6" rx="3" fill="#64748B" />
    <rect x="20" y="90" width="120" height="6" rx="3" fill="#64748B" />
    <!-- User avatar -->
    <circle cx="35" cy="115" r="10" fill="#E2E8F0" />
    <rect x="52" y="112" width="60" height="6" rx="3" fill="#64748B" />
  </g>

  <!-- Floating Orange Quote mark -->
  <g transform="translate(90, 70)">
    <circle cx="20" cy="20" r="20" fill="#FFF4E6" />
    <path d="M16 26C16 22 18 19 21 16M21 26C21 22 23 19 26 16" stroke="#FF8C00" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
