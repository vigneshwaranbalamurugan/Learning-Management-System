<div class="absolute top-[60px] right-0 w-[260px] bg-white rounded-xl shadow-lg border border-gray-200 z-[999] overflow-hidden transition-all duration-200 ease-out origin-top-right animate-[dropdownFadeIn_250ms_cubic-bezier(0.16,1,0.3,1)]">
  <!-- Header -->
  <div class="flex items-center gap-3 p-4">
    <div class="w-10 h-10 rounded-full overflow-hidden" *ngIf="user.profilePictureUrl; else initialAvatar">
      <img [src]="user.profilePictureUrl" alt="Avatar" class="w-full h-full object-cover" />
    </div>
    <ng-template #initialAvatar>
      <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-semibold text-base">
        {{ avatarInitial }}
      </div>
    </ng-template>
    <div class="flex flex-col overflow-hidden">
      <div class="text-sm font-semibold text-gray-800 truncate">{{ user.fullName || (user.firstName + ' ' + user.lastName) }}</div>
      <div class="text-xs text-gray-500 truncate">{{ user.email }}</div>
    </div>
  </div>

  <div class="h-[1px] bg-gray-100"></div>

  <!-- Menu Items -->
  <ul class="list-none p-2 m-0 flex flex-col gap-0.5">
    <li>
      <button (click)="navigateToProfile()" class="w-full flex items-center gap-2.5 px-4 py-2.5 rounded-lg text-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition text-left cursor-pointer border-none bg-transparent">
        <svg class="w-[18px] h-[18px] opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span>My Profile</span>
      </button>
    </li>
    <li *ngIf="user.role?.toLowerCase() === 'instructor' || user.role?.toLowerCase() === 'admin'">
      <button (click)="navigateToRevenue()" class="w-full flex items-center gap-2.5 px-4 py-2.5 rounded-lg text-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition text-left cursor-pointer border-none bg-transparent">
        <svg class="w-[18px] h-[18px] opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Revenue</span>
      </button>
    </li>
    <li *ngIf="user.role?.toLowerCase() === 'learner'">
      <button (click)="navigateToCertificates()" class="w-full flex items-center gap-2.5 px-4 py-2.5 rounded-lg text-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition text-left cursor-pointer border-none bg-transparent">
        <svg class="w-[18px] h-[18px] opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
        </svg>
        <span>My Certificates</span>
      </button>
    </li>
    <li>
      <button (click)="navigateToSettings()" class="w-full flex items-center gap-2.5 px-4 py-2.5 rounded-lg text-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition text-left cursor-pointer border-none bg-transparent">
        <svg class="w-[18px] h-[18px] opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Settings</span>
      </button>
    </li>
  </ul>

  <div class="h-[1px] bg-gray-100"></div>

  <!-- Logout Section -->
  <div class="p-1">
    <button (click)="onLogout()" class="w-full flex items-center gap-2.5 px-4 py-2.5 rounded-lg text-sm text-red-500 hover:bg-red-50 hover:text-red-600 transition text-left cursor-pointer border-none bg-transparent">
      <svg class="w-[18px] h-[18px] text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Logout</span>
    </button>
  </div>
</div>
