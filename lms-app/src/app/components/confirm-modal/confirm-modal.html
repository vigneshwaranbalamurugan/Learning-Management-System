<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[9999] backdrop-blur-xs transition-opacity" *ngIf="isOpen">
  <div class="bg-white rounded-xl w-full max-w-[400px] p-6 shadow-xl animate-[scaleUp_250ms_cubic-bezier(0.34,1.56,0.64,1)]">
    <h3 class="text-lg font-bold text-gray-900 mt-0 mb-2">{{ title }}</h3>
    <p class="text-sm text-gray-600 mb-6 leading-relaxed">{{ message }}</p>
    <div class="flex justify-end gap-3">
      <button (click)="cancel.emit()" class="px-4 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg text-sm font-semibold transition cursor-pointer border-none">
        {{ cancelText }}
      </button>
      <button (click)="confirm.emit()" 
              class="px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer border-none text-white"
              [class.bg-red-600]="isDanger"
              [class.hover:bg-red-700]="isDanger"
              [class.bg-primary]="!isDanger"
              [class.hover:bg-primary-hover]="!isDanger">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
