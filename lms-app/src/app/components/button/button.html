<button
  [type]="type"
  [disabled]="disabled || loading"
  [class]="'inline-flex items-center justify-center font-semibold rounded-lg text-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed px-5 py-3 cursor-pointer w-full ' + 
    (variant === 'primary' ? 'bg-primary text-white hover:bg-primary-hover focus:ring-primary' : 
     variant === 'secondary' ? 'bg-secondary text-white hover:bg-secondary-hover focus:ring-secondary' : 
     variant === 'success' ? 'bg-success text-white hover:bg-success focus:ring-success' : 
     variant === 'danger' ? 'bg-danger text-white hover:bg-danger focus:ring-danger' : 
     'border border-primary text-primary bg-white hover:bg-primary-light focus:ring-primary') + ' ' + 
    customClass"
>
  <svg *ngIf="loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
  <ng-content></ng-content>
</button>
