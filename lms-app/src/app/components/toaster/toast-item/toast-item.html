<div 
  class="toast-item-container"
  [class.dismissing]="isDismissing"
  [class]="toast.type"
  role="alert"
  aria-live="polite"
  (mouseenter)="pauseTimer()"
  (mouseleave)="resumeTimer()"
>
  <div class="toast-content">
    <!-- Icons -->
    <div class="toast-icon-wrapper">
      @if (toast.type === 'success') {
        <svg class="toast-icon success" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      } @else if (toast.type === 'error') {
        <svg class="toast-icon error" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      } @else if (toast.type === 'warning') {
        <svg class="toast-icon warning" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      } @else {
        <svg class="toast-icon info" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      }
    </div>

    <!-- Message -->
    <div class="toast-message">
      {{ toast.message }}
    </div>

    <!-- Close Button -->
    <button class="toast-close-btn" (click)="dismiss()" aria-label="Close notification">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Progress Bar -->
  <div class="toast-progress-bar-wrapper">
    <div 
      class="toast-progress-bar"
      [class]="toast.type"
      [style.width.%]="progressWidth()"
    ></div>
  </div>
</div>
