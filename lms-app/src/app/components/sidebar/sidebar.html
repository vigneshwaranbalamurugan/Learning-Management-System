<aside
  class="fixed top-0 left-0 bottom-0 bg-white text-gray-600 border-r border-gray-200
         flex flex-col z-[100] transition-all duration-300 ease-in-out"
  [style.width]="sidebar.isCollapsed() ? '80px' : '280px'"
  [class.translate-x-0]="!sidebar.isMobile() || sidebar.isMobileSidebarOpen()"
  [class.-translate-x-full]="sidebar.isMobile() && !sidebar.isMobileSidebarOpen()">

  <!-- ── Logo ──────────────────────────────────────────────── -->
  <div class="h-[72px] flex items-center px-5 border-b border-gray-200 shrink-0 overflow-hidden"
       [class.justify-center]="sidebar.isCollapsed()"
       [class.justify-start]="!sidebar.isCollapsed()"
       [class.gap-3]="!sidebar.isCollapsed()">
    <img src="./coursehub.webp" alt="CourseHub Logo"
         class="h-10 w-auto object-contain shrink-0" />
    <span class="text-xl font-bold tracking-tight text-primary whitespace-nowrap transition-all duration-200"
          [class.hidden]="sidebar.isCollapsed()">
      CourseHub <span class="text-secondary">LMS</span>
    </span>
  </div>

  <!-- ── Navigation (no overflow — tooltips must bleed outside 80px) ── -->
  <nav class="flex-grow py-4 px-3">
    <ul class="flex flex-col gap-0.5 list-none p-0 m-0">
      <ng-container *ngFor="let item of displayedMenuItems">
        <li class="relative group">

          <!-- Nav link (Internal) -->
        <a *ngIf="!item.isExternal"
           [routerLink]="getAbsoluteRoute(item.route)"
           (click)="onNavLinkClick()"
           class="flex items-center gap-4 px-4 py-2.5 rounded-lg text-gray-500
                  hover:bg-gray-50 hover:text-gray-900 transition-all duration-200
                  border-l-[3px] border-transparent w-full text-left no-underline"
           [class.text-primary]="isRouteActive(item.route)"
           [class.border-l-secondary]="isRouteActive(item.route)">
           <ng-container *ngTemplateOutlet="linkContent; context: { item: item }"></ng-container>
        </a>

        <!-- Nav link (External) -->
        <a *ngIf="item.isExternal"
           [href]="item.route"
           target="_blank"
           rel="noopener noreferrer"
           class="flex items-center gap-4 px-4 py-2.5 rounded-lg text-gray-500
                  hover:bg-gray-50 hover:text-gray-900 transition-all duration-200
                  border-l-[3px] border-transparent w-full text-left no-underline">
           <ng-container *ngTemplateOutlet="linkContent; context: { item: item }"></ng-container>
        </a>

        <ng-template #linkContent let-item="item">
          <div class="flex items-center justify-center w-6 h-6 shrink-0">
            <svg class="w-5 h-5 transition-transform duration-200 group-hover:scale-110"
                 [class.text-secondary]="!item.isExternal && isRouteActive(item.route)"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2" [attr.d]="item.iconPath" />
            </svg>
          </div>
          <span class="text-sm font-medium whitespace-nowrap transition-all duration-200"
                [class.hidden]="sidebar.isCollapsed()">
            {{ item.label }}
          </span>
          <svg *ngIf="item.isExternal" class="w-3.5 h-3.5 ml-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        </ng-template>

        <!-- Tooltip — only when collapsed.
             left-full = right edge of the <li> (= 80px sidebar width)
             ml-2      = 8px gap.
             No overflow on <nav> so it renders freely. -->
        <div *ngIf="sidebar.isCollapsed()"
             class="pointer-events-none absolute left-full top-1/2 -translate-y-1/2 ml-2
                    z-[200] opacity-0 group-hover:opacity-100 transition-opacity duration-150">
          <span class="bg-gray-800 text-white px-3 py-1.5 rounded-md
                       text-xs font-semibold whitespace-nowrap shadow-md block">
            {{ item.label }}
          </span>
          <span class="absolute right-full top-1/2 -translate-y-1/2
                       border-4 border-transparent border-r-gray-800"></span>
        </div>
      </li>
      </ng-container>
    </ul>
  </nav>

  <!-- ── Bottom: Collapse toggle + Logout ──────────────────── -->
  <div class="p-3 shrink-0 border-t border-gray-100">

    <!-- Collapse / Expand -->
    <div class="relative group mb-1">
      <button (click)="onToggle()"
              class="flex items-center gap-4 px-4 py-2.5 rounded-lg text-gray-500
                     hover:bg-gray-50 hover:text-gray-900 transition-all duration-200
                     w-full text-left cursor-pointer border-none bg-transparent">
        <div class="flex items-center justify-center w-6 h-6 shrink-0">
          <svg class="w-5 h-5 transition-transform duration-300"
               [class.rotate-180]="!sidebar.isCollapsed()"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap transition-all duration-200"
              [class.hidden]="sidebar.isCollapsed()">
          Collapse Sidebar
        </span>
      </button>

      <div *ngIf="sidebar.isCollapsed()"
           class="pointer-events-none absolute left-full top-1/2 -translate-y-1/2 ml-2
                  z-[200] opacity-0 group-hover:opacity-100 transition-opacity duration-150">
        <span class="bg-gray-800 text-white px-3 py-1.5 rounded-md
                     text-xs font-semibold whitespace-nowrap shadow-md block">
          Expand Sidebar
        </span>
        <span class="absolute right-full top-1/2 -translate-y-1/2
                     border-4 border-transparent border-r-gray-800"></span>
      </div>
    </div>

    <!-- Logout -->
    <div class="relative group">
      <button (click)="logout.emit()"
              class="flex items-center gap-4 px-4 py-2.5 rounded-lg text-gray-500
                     hover:bg-red-50 hover:text-red-600 transition-all duration-200
                     w-full text-left cursor-pointer border-none bg-transparent">
        <div class="flex items-center justify-center w-6 h-6 shrink-0">
          <svg class="w-5 h-5 transition-transform duration-200 group-hover:scale-110"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </div>
        <span class="text-sm font-medium whitespace-nowrap transition-all duration-200"
              [class.hidden]="sidebar.isCollapsed()">
          Logout
        </span>
      </button>

      <div *ngIf="sidebar.isCollapsed()"
           class="pointer-events-none absolute left-full top-1/2 -translate-y-1/2 ml-2
                  z-[200] opacity-0 group-hover:opacity-100 transition-opacity duration-150">
        <span class="bg-red-600 text-white px-3 py-1.5 rounded-md
                     text-xs font-semibold whitespace-nowrap shadow-md block">
          Logout
        </span>
        <span class="absolute right-full top-1/2 -translate-y-1/2
                     border-4 border-transparent border-r-red-600"></span>
      </div>
    </div>
  </div>
</aside>
