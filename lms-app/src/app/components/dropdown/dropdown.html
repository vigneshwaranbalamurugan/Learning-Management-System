<div class="mb-4.5 flex flex-col gap-1.5 w-full relative">
  <label *ngIf="label" class="text-sm font-semibold text-text-secondary select-none">
    {{ label }}
  </label>
  
  <div class="relative w-full">
    <!-- Dropdown Trigger Button -->
    <button
      type="button"
      [disabled]="disabled"
      (click)="!disabled && toggleDropdown()"
      [id]="id"
      [class]="'w-full py-3 text-sm rounded-xl border text-left flex items-center justify-between transition-all duration-200 bg-white focus:outline-none focus:ring-1 focus:ring-primary ' + 
        (icon !== 'none' ? 'pl-11 pr-10' : 'px-4 pr-10') + ' ' + 
        (disabled ? 'opacity-60 cursor-not-allowed bg-gray-50 ' : 'cursor-pointer ') + 
        (error ? 'border-danger focus:border-danger focus:ring-danger' : 'border-border-default focus:border-primary')"
    >
      <!-- Prefix Icon -->
      <span *ngIf="icon !== 'none'" class="absolute left-4 text-text-muted">
        <!-- Role / Graduation Cap Icon -->
        <svg *ngIf="icon === 'role'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M12 2.25V4.5m0 16.5v2.25m-9-13.5v3.375m18-3.375v3.375" />
        </svg>
        <!-- User Icon -->
        <svg *ngIf="icon === 'user'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </span>

      <!-- Dropdown Value Display -->
      <span *ngIf="value" class="text-text-primary">{{ selectedLabel }}</span>
      <span *ngIf="!value" class="text-text-muted">{{ placeholder }}</span>

      <!-- Chevron Down Icon -->
      <span class="absolute right-4 text-text-muted transition-transform duration-200" [class.rotate-180]="isOpen">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </span>
    </button>

    <!-- Custom Dropdown Options Overlay -->
    <div
      *ngIf="isOpen"
      class="absolute z-50 w-full mt-1.5 bg-white border border-border-default rounded-xl shadow-lg max-h-60 overflow-y-auto left-0 top-[100%] py-1 animate-[fadeIn_0.15s_ease-out]"
    >
      <button
        *ngFor="let opt of options"
        type="button"
        (click)="selectOption(opt.value)"
        class="w-full px-4 py-3 text-sm text-left hover:bg-bg-surface-hover transition-colors flex items-center justify-between cursor-pointer text-text-primary bg-transparent border-none focus:outline-none"
      >
        <span>{{ opt.label }}</span>
        <!-- Selected Checkmark -->
        <svg *ngIf="value === opt.value" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-primary">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Validation Error message -->
  <div *ngIf="error" class="text-xs text-danger mt-0.5 flex items-center gap-1 select-none">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 flex-shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
    </svg>
    <span>{{ error }}</span>
  </div>
</div>
