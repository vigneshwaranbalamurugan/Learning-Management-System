<div class="mb-4.5 flex flex-col gap-1.5 w-full">
  <label *ngIf="label" [for]="id" class="text-sm font-semibold text-text-secondary select-none">
    {{ label }}
  </label>
  <div class="relative flex items-center w-full">
    
    <!-- Prefix Icons -->
    <span *ngIf="icon !== 'none'" class="absolute left-4 text-text-muted">
      <!-- Email Icon -->
      <svg *ngIf="icon === 'email'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
      </svg>
      <!-- Lock Icon -->
      <svg *ngIf="icon === 'lock'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
      </svg>
      <!-- User Icon -->
      <svg *ngIf="icon === 'user'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
      <!-- Role / Graduation Cap Icon -->
      <svg *ngIf="icon === 'role'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M12 2.25V4.5m0 16.5v2.25m-9-13.5v3.375m18-3.375v3.375" />
      </svg>
    </span>

    <!-- Normal Input -->
    <input
      *ngIf="type !== 'select'"
      [id]="id"
      [type]="inputType"
      [value]="value"
      (input)="onInput($event)"
      [placeholder]="placeholder"
      [class]="'w-full py-3 text-sm rounded-xl border outline-none transition-all duration-200 bg-white ' + 
        (icon !== 'none' ? 'pl-11 pr-4' : 'px-4') + ' ' + 
        (error ? 'border-danger focus:border-danger focus:ring-1 focus:ring-danger' : 'border-border-default focus:border-primary focus:ring-1 focus:ring-primary') + ' ' + 
        (type === 'password' ? 'pr-11' : '')"
    />

    <!-- Select Input -->
    <select
      *ngIf="type === 'select'"
      [id]="id"
      [value]="value"
      (change)="onInput($event)"
      [class]="'w-full py-3 text-sm rounded-xl border outline-none transition-all duration-200 bg-white appearance-none cursor-pointer ' + 
        (icon !== 'none' ? 'pl-11 pr-10' : 'px-4 pr-10') + ' ' + 
        (error ? 'border-danger focus:border-danger focus:ring-1 focus:ring-danger' : 'border-border-default focus:border-primary focus:ring-1 focus:ring-primary')"
    >
      <option value="" disabled selected hidden>{{ placeholder }}</option>
      <option *ngFor="let opt of options" [value]="opt.value">{{ opt.label }}</option>
    </select>
    
    <!-- Select Chevron Down Icon -->
    <span *ngIf="type === 'select'" class="absolute right-4 text-text-muted pointer-events-none">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
      </svg>
    </span>

    <!-- Password visibility toggle button -->
    <button
      *ngIf="type === 'password'"
      type="button"
      (click)="togglePasswordVisibility()"
      class="absolute right-3 p-1.5 hover:bg-bg-surface-hover rounded-lg text-text-muted hover:text-text-primary transition-colors cursor-pointer focus:outline-none"
      aria-label="Toggle password visibility"
    >
      <!-- Eye Icon (Password hidden, show text) -->
      <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
      <!-- Eye Slash Icon (Password shown, hide text) -->
      <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
      </svg>
    </button>
  </div>
  
  <!-- Validation Error message -->
  <div *ngIf="error" class="text-xs text-danger mt-0.5 flex items-center gap-1 select-none animate-fadeIn">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 flex-shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
    </svg>
    <span>{{ error }}</span>
  </div>
</div>
