<div #playerContainer 
     class="relative w-full h-full bg-black flex items-center justify-center group/player overflow-hidden"
     (mousemove)="onMouseMove()"
     (mouseleave)="onMouseLeave()">
  <video #videoPlayer
         [autoplay]="autoplay"
         class="w-full h-full object-contain cursor-pointer"
         [src]="src"
         (timeupdate)="onTimeUpdate(videoPlayer)"
         (loadedmetadata)="onLoadedMetadata(videoPlayer)"
         (ended)="onVideoEnded(videoPlayer)"
         (play)="isPlaying.set(true)"
         (pause)="isPlaying.set(false)"
         (contextmenu)="$event.preventDefault()"
         controlsList="nodownload"
         disablePictureInPicture
         disableRemotePlayback>
    Your browser does not support the video tag.
  </video>

  <!-- Play/Pause big overlay button on hover/idle -->
  <div class="absolute inset-0 flex items-center justify-center bg-black/20 transition-opacity duration-300"
       [class.opacity-100]="showControls() || !isPlaying()"
       [class.opacity-0]="!showControls() && isPlaying()"
       [class.pointer-events-none]="!showControls() && isPlaying()"
       (click)="togglePlay(videoPlayer)">
    <button class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md hover:cursor-pointer  border-white/30 flex items-center justify-center hover:scale-105 transition-transform duration-200 shadow-lg text-white">
      @if (isPlaying()) {
        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      } @else {
        <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      }
    </button>
  </div>

  <!-- Custom Controls Panel -->
  <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 via-black/60 to-transparent flex flex-col gap-3 transition-opacity duration-300 z-10"
       [class.opacity-100]="showControls()"
       [class.opacity-0]="!showControls() && isPlaying()"
       [class.pointer-events-none]="!showControls() && isPlaying()">
    
    <!-- Progress Bar -->
    <div class="relative w-full h-1.5 bg-white/30 rounded-full cursor-pointer group/progress select-none"
         #progressBar
         (mousedown)="$event.stopPropagation(); onScrubStart($event, videoPlayer, progressBar)">
      <!-- Played area -->
      <div class="absolute top-0 left-0 h-full bg-[#1C1C7B] rounded-full transition-all duration-75"
           [style.width.%]="(currentTime() / (duration() || 1)) * 100"></div>

      <!-- Scrub Handle -->
      <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-white border border-[#1C1C7B] rounded-full opacity-0 group-hover/progress:opacity-100 transition-opacity"
           [style.left.%]="(currentTime() / (duration() || 1)) * 100"></div>
    </div>

    <!-- Control Buttons & Metadata -->
    <div class="flex items-center justify-between text-white text-xs select-none">
      <div class="flex items-center gap-4">
        <!-- Play/Pause -->
        <button (click)="$event.stopPropagation(); togglePlay(videoPlayer)" class="hover:text-primary transition-colors cursor-pointer bg-transparent border-none">
          @if (isPlaying()) {
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          }
        </button>

        <!-- Time counter -->
        <span class="font-mono">{{ formatTime(currentTime()) }} / {{ formatTime(duration()) }}</span>

        <!-- Volume Controls -->
        <div class="flex items-center gap-1.5 group/volume">
          <button (click)="$event.stopPropagation(); toggleMute(videoPlayer)" class="hover:text-primary transition-colors cursor-pointer bg-transparent border-none">
            @if (isMuted() || volume() === 0) {
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
              </svg>
            } @else if (volume() < 0.5) {
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L9 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            }
          </button>
          <!-- Volume slider (visible on hover) -->
          <input type="range" min="0" max="1" step="0.05"
                 [value]="isMuted() ? 0 : volume()"
                 (input)="onVolumeChange($event, videoPlayer)"
                 (click)="$event.stopPropagation()"
                 class="w-0 overflow-hidden group-hover/volume:w-16 transition-all duration-300 h-1 bg-white/30 rounded-lg appearance-none cursor-pointer accent-white">
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Fullscreen -->
        <button (click)="$event.stopPropagation(); toggleFullscreen(playerContainer)" class="hover:text-primary transition-colors cursor-pointer bg-transparent border-none">
          @if (isFullscreen()) {
            <!-- Exit Fullscreen SVG -->
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
          } @else {
            <!-- Enter Fullscreen SVG -->
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
          }
        </button>
      </div>
    </div>
  </div>
</div>
