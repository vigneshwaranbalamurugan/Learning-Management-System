<nav
  [class]="'fixed top-0 left-0 w-full h-[72px] bg-white z-50 transition-all duration-300 flex items-center border-b border-border-default ' + 
    (isScrolled ? 'shadow-md border-transparent' : '')"
>
  <div class="max-w-[1400px] w-full mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
    
    <!-- Brand Logo Section -->
    <a href="#" (click)="scrollToSection('home', $event)" class="flex items-center gap-2 group cursor-pointer select-none">
      <img
        src="/coursehub.webp"
        alt="CourseHub Logo"
        class="h-10 w-auto object-contain transition-transform duration-300 group-hover:scale-105"
      />
      <span class="text-xl font-bold tracking-tight text-primary">CourseHub <span class="text-secondary">LMS</span></span>
    </a>

    <!-- Center Navigation Links (Desktop) -->
    <div class="hidden md:flex items-center gap-8">
      <a
        href="#home"
        (click)="scrollToSection('home', $event)"
        [class]="'nav-link relative text-sm font-semibold select-none cursor-pointer transition-colors duration-300 py-2 ' + 
          (activeSection() === 'home' ? 'text-primary active' : 'text-text-primary hover:text-primary')"
      >
        Home
      </a>
      <a
        href="#about"
        (click)="scrollToSection('about', $event)"
        [class]="'nav-link relative text-sm font-semibold select-none cursor-pointer transition-colors duration-300 py-2 ' + 
          (activeSection() === 'about' ? 'text-primary active' : 'text-text-primary hover:text-primary')"
      >
        About
      </a>
      <a
        href="#feedback"
        (click)="scrollToSection('feedback', $event)"
        [class]="'nav-link relative text-sm font-semibold select-none cursor-pointer transition-colors duration-300 py-2 ' + 
          (activeSection() === 'feedback' ? 'text-primary active' : 'text-text-primary hover:text-primary')"
      >
        Feedback
      </a>
    </div>

    <!-- Right Actions Section (Desktop) -->
    <div class="hidden md:flex items-center gap-4">
      <button
        type="button"
        (click)="navigateToAuth('login')"
        class="px-5 py-2.5 text-sm font-semibold rounded-lg text-primary bg-white border border-primary hover:bg-primary-light transition-all duration-300 cursor-pointer shadow-sm hover:shadow active:scale-95"
      >
        Login
      </button>
      <button
        type="button"
        (click)="navigateToAuth('register')"
        class="px-5 py-2.5 text-sm font-semibold rounded-lg text-white bg-primary hover:bg-primary-hover transition-all duration-300 cursor-pointer shadow-sm hover:shadow-md hover:-translate-y-0.5 active:scale-95"
      >
        Sign Up
      </button>
    </div>

    <!-- Mobile Menu Toggle Button (Hamburger) -->
    <div class="flex items-center md:hidden">
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="p-2 text-text-primary hover:text-primary hover:bg-bg-surface rounded-lg transition-colors cursor-pointer focus:outline-none"
        aria-label="Toggle menu"
      >
        <svg
          *ngIf="!isMobileMenuOpen"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        <svg
          *ngIf="isMobileMenuOpen"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

  </div>

  <!-- Mobile Menu Drawer Overlay -->
  <div
    *ngIf="isMobileMenuOpen"
    class="fixed inset-0 top-[72px] bg-white z-40 flex flex-col p-6 gap-6 md:hidden border-t border-border-default animate-[fadeIn_0.2s_ease-out]"
  >
    <div class="flex flex-col gap-4">
      <a
        href="#home"
        (click)="scrollToSection('home', $event)"
        [class]="'text-lg font-semibold py-2 border-b border-border-light cursor-pointer transition-colors ' + 
          (activeSection() === 'home' ? 'text-primary' : 'text-text-primary')"
      >
        Home
      </a>
      <a
        href="#about"
        (click)="scrollToSection('about', $event)"
        [class]="'text-lg font-semibold py-2 border-b border-border-light cursor-pointer transition-colors ' + 
          (activeSection() === 'about' ? 'text-primary' : 'text-text-primary')"
      >
        About
      </a>
      <a
        href="#feedback"
        (click)="scrollToSection('feedback', $event)"
        [class]="'text-lg font-semibold py-2 border-b border-border-light cursor-pointer transition-colors ' + 
          (activeSection() === 'feedback' ? 'text-primary' : 'text-text-primary')"
      >
        Feedback
      </a>
    </div>

    <div class="flex flex-col gap-3 mt-auto">
      <button
        type="button"
        (click)="navigateToAuth('login')"
        class="w-full py-3 text-center font-semibold rounded-lg text-primary border border-primary hover:bg-primary-light transition-colors cursor-pointer"
      >
        Login
      </button>
      <button
        type="button"
        (click)="navigateToAuth('register')"
        class="w-full py-3 text-center font-semibold rounded-lg text-white bg-primary hover:bg-primary-hover transition-colors cursor-pointer"
      >
        Sign Up
      </button>
    </div>
  </div>
</nav>
