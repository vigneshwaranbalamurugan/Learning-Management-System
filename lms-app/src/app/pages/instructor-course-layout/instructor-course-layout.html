<div class="flex flex-col gap-6 animate-[fadeInContent_400ms_ease]">
  <!-- Top Navigation/Overview Area -->
  <div class="relative overflow-hidden bg-slate-950 text-white rounded-2xl p-5 md:p-7 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 md:gap-0 shadow-xs">
    <!-- Static Banner Image -->
    <img src="/explore-banner.png" alt="Dashboard Banner" class="absolute inset-0 w-full h-full object-cover opacity-35 select-none pointer-events-none" />
    <div class="absolute inset-0 bg-gradient-to-r from-primary/90 via-slate-950/80 to-transparent w-full h-full"></div>
    
    <div class="flex flex-col relative z-10">
      <button (click)="navigateBack()" class="flex items-center gap-2 text-xs font-bold text-white/70 hover:text-white bg-transparent border-none mb-3 cursor-pointer self-start transition">
        ← Back to Courses
      </button>
      <div class="flex items-center gap-3 mb-2">
        <span class="bg-white/15 border border-white/20 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">
          {{ course()?.categoryName || 'Course Management' }}
        </span>
        <span class="text-xs text-[#FF8C00] font-bold">★ {{ course()?.averageRating ? (course()?.averageRating | number:'1.1-1') : 'N/A' }}</span>
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">{{ isLoading() ? 'Loading Course...' : course()?.title }}</h2>
      <p class="text-white/85 text-xs sm:text-sm max-w-[600px] leading-relaxed mt-1 line-clamp-1">
        {{ course()?.description }}
      </p>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="flex items-center justify-center min-h-[40vh] bg-white border border-gray-100 rounded-2xl shadow-sm p-8">
    <app-loader></app-loader>
  </div>

  <!-- Sub-navigation Tabs and Router Outlet -->
  <div *ngIf="!isLoading()" class="space-y-6">
    <!-- Sub-navigation Tabs -->
    <div class="bg-white border border-gray-150 rounded-2xl p-2 shadow-xs grid grid-cols-2 sm:flex sm:flex-wrap gap-1">
      <a 
        *ngFor="let tab of tabs"
        [routerLink]="[tab.path]"
        [ngClass]="isTabActive(tab.path) ? 'bg-[#1C1C7B] text-white' : 'text-gray-500 hover:text-slate-800 hover:bg-slate-50'"
        class="flex items-center justify-center sm:justify-start gap-2 px-2 sm:px-4 py-3 rounded-xl text-xs font-bold transition duration-150 cursor-pointer no-underline decoration-none">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="tab.icon" />
        </svg>
        <span class="truncate">{{ tab.label }}</span>
      </a>
    </div>

    <!-- Active Tab Panel Content -->
    <div class="bg-white border border-gray-100 rounded-2xl p-4 sm:p-6 shadow-sm min-h-[50vh]">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
