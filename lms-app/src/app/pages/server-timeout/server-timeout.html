<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[var(--color-warning)] opacity-[0.05] rounded-full blur-3xl -z-10 mix-blend-multiply"></div>
  
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 z-10 relative text-center p-12">
    <div class="mb-8 flex justify-center">
      <div class="w-24 h-24 rounded-full bg-amber-50 flex items-center justify-center relative">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div class="absolute inset-0 border-4 border-amber-200 border-t-amber-500 rounded-full animate-spin"></div>
      </div>
    </div>
    
    <h2 class="text-2xl font-bold text-gray-900 mb-4">Request Timeout</h2>
    <p class="text-gray-500 mb-10 leading-relaxed">
      The server is taking too long to respond. This might be due to high traffic or a temporary issue.
    </p>
    
    <div class="flex flex-col gap-4">
      <button 
        (click)="retry()"
        class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--color-primary)] transition-all duration-200">
        Try again
      </button>
    </div>
  </div>
</div>
