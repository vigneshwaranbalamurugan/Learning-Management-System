<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6 relative overflow-hidden">
  <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-[var(--color-danger)] opacity-[0.05] rounded-full blur-3xl -z-10 mix-blend-multiply"></div>
  
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 z-10 relative text-center p-12">
    <div class="mb-8 flex justify-center">
      <div class="w-24 h-24 rounded-full bg-red-50 flex items-center justify-center animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.168a1 1 0 11-1.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
        </svg>
      </div>
    </div>
    
    <h2 class="text-2xl font-bold text-gray-900 mb-4">No Connection</h2>
    <p class="text-gray-500 mb-10 leading-relaxed">
      We couldn't connect to the server. Please check your internet connection and try again.
    </p>
    
    <div class="flex flex-col gap-4">
      <button 
        (click)="retry()"
        class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--color-primary)] transition-all duration-200">
        Retry connection
      </button>
    </div>
  </div>
</div>
