<div class="min-h-screen bg-gray-50 flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Decorative background elements -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[var(--color-primary)] opacity-10 rounded-full blur-3xl -z-10 mix-blend-multiply"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[var(--color-secondary)] opacity-10 rounded-full blur-3xl -z-10 mix-blend-multiply"></div>
  
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 z-10 relative text-center p-12">
    <div class="mb-8">
      <h1 class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-secondary)] tracking-tighter animate-pulse">404</h1>
    </div>
    
    <h2 class="text-2xl font-bold text-gray-900 mb-4">Page not found</h2>
    <p class="text-gray-500 mb-10 leading-relaxed">
      Oops! The page you're looking for seems to have vanished into thin air. Let's get you back on track.
    </p>
    
    <div class="flex flex-col gap-4">
      <button 
        routerLink="/"
        class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-[var(--color-primary)] hover:bg-[var(--color-primary-hover)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[var(--color-primary)] transition-all duration-200 transform hover:-translate-y-1 hover:shadow-lg">
        Go back home
      </button>
      
      <button 
        (click)="goBack()"
        class="w-full flex justify-center py-3.5 px-4 border-2 border-gray-200 rounded-xl shadow-sm text-sm font-semibold text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 transition-all duration-200">
        Previous page
      </button>
    </div>
  </div>
</div>
