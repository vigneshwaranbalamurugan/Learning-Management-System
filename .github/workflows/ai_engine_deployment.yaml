name: 🤖 Deploy AI Engine (Docker Hub → AKS)

# ──────────────────────────────────────────────────────────────────────────────
# Uses Docker Hub for container images (same pattern as backend_deployment.yaml):
#   • Build image from ai-engine/Dockerfile
#   • Push to Docker Hub as <DOCKERHUB_USERNAME>/lms-ai-engine:<sha-tag>
#   • Deploy to AKS using stored kubeconfig (KUBE_CONFIG_B64)
#
# The AI engine is INTERNAL ONLY — ClusterIP service, no public ingress.
# LMSApi calls it via: http://lms-ai-engine-svc/
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - feature/ai_integration
    paths:
      - 'ai-engine/**'
      - 'azure/k8s/ai-engine-*.yaml'
      - '.github/workflows/ai_engine_deployment.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: lms-ai-engine

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Build Docker image and push to Docker Hub.
  # ════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    environment: Development

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Image tag: sha-<short commit> ──────────────────────────────────────
      - name: Generate image tag
        id: meta
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          FULL="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:$TAG"
          echo "image_tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "full_image=$FULL"   >> "$GITHUB_OUTPUT"
          echo "**Image:** \`$FULL\`" >> "$GITHUB_STEP_SUMMARY"

      # ── Login to Docker Hub ───────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Set up Docker Buildx ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build and Push ────────────────────────────────────────────────────
      # Context is ai-engine/ — the Dockerfile lives there.
      # The sentence-transformers model is baked in at build time (Dockerfile
      # pre-downloads all-MiniLM-L6-v2), so first-request latency is minimal.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ai-engine
          file: ai-engine/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Deploy to AKS using stored kubeconfig.
  #
  # Prerequisites (run once after infra deploy):
  #   az aks get-credentials --resource-group lms-rg-dev --name lms-aks-dev
  #   cat ~/.kube/config | base64 | pbcopy    # macOS — paste as KUBE_CONFIG_B64 secret
  # ════════════════════════════════════════════════════════════════════════════
  deploy-to-aks:
    name: Deploy AI Engine to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Restore kubeconfig from GitHub Secret ─────────────────────────────
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # ── Substitute placeholders in AI engine deployment manifest ──────────
      - name: Prepare AI Engine K8s Manifests
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"

          # Replace image placeholder with real Docker Hub image + sha tag
          sed -i "s|<DOCKERHUB_USERNAME>|$DH_USER|g"                  azure/k8s/ai-engine-deployment.yaml
          sed -i "s|$IMAGE_NAME:latest|$IMAGE_NAME:$TAG|g"            azure/k8s/ai-engine-deployment.yaml

          # Inject UAMI client ID and Azure tenant ID (shared with lms-api)
          sed -i "s|<UAMI_CLIENT_ID>|${{ secrets.UAMI_CLIENT_ID }}|g"    azure/k8s/serviceaccount.yaml
          sed -i "s|<UAMI_CLIENT_ID>|${{ secrets.UAMI_CLIENT_ID }}|g"    azure/k8s/secretproviderclass.yaml
          sed -i "s|<AZURE_TENANT_ID>|${{ secrets.AZURE_TENANT_ID }}|g"  azure/k8s/secretproviderclass.yaml
          sed -i "s|<KEY_VAULT_NAME>|${{ secrets.KEY_VAULT_NAME }}|g"    azure/k8s/secretproviderclass.yaml

      # ── Apply only AI engine manifests ────────────────────────────────────
      # Applied individually to avoid re-deploying lms-api unnecessarily.
      - name: Apply AI Engine Manifests
        run: |
          kubectl apply -f azure/k8s/ai-engine-configmap.yaml
          kubectl apply -f azure/k8s/ai-engine-pvc.yaml
          kubectl apply -f azure/k8s/ai-engine-service.yaml
          kubectl apply -f azure/k8s/secretproviderclass.yaml
          kubectl apply -f azure/k8s/ai-engine-deployment.yaml

      # ── Rolling restart & wait ─────────────────────────────────────────────
      - name: Rolling Restart & Wait
        run: |
          kubectl rollout restart deployment/lms-ai-engine -n lms
          kubectl rollout status deployment/lms-ai-engine -n lms --timeout=300s

      # ── Verify health from within the cluster ─────────────────────────────
      - name: Verify AI Engine Health
        run: |
          echo "### ✅ AI Engine Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ needs.build-and-push.outputs.full_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Wait for the pod to be ready before probing
          kubectl wait --for=condition=ready pod \
            -l app=lms-ai-engine -n lms --timeout=120s

          # Hit /health via port-forward (runs in background for the duration of the check)
          kubectl port-forward svc/lms-ai-engine-svc 18001:80 -n lms &
          PF_PID=$!
          
          echo "Waiting for port-forward to open..."
          HTTP_CODE="000"
          for i in {1..10}; do
            sleep 2
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18001/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
          done
          
          kill $PF_PID 2>/dev/null || true

          if [ "$HTTP_CODE" = "200" ]; then
            echo "**Health check:** ✅ HTTP $HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Health check:** ❌ HTTP $HTTP_CODE — check pod logs" >> "$GITHUB_STEP_SUMMARY"
            kubectl logs -n lms deployment/lms-ai-engine --tail=50
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> AI Engine is reachable at \`http://lms-ai-engine-svc/\` from within the cluster." >> "$GITHUB_STEP_SUMMARY"
