name: Deploy Angular App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Development

    defaults:
      run:
        working-directory: lms-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lms-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Environment File
        run: |
          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            apiUrl: '${{ vars.API_URL }}',
            hubUrl: '${{ vars.HUB_URL }}',
            hangfireUrl: '${{ vars.HANGFIRE_URL }}',
            razorpayKey: '${{ secrets.RAZORPAY_KEY }}'
          };
          EOF

      - name: Build Angular App
        run: npm run build -- --configuration production --base-href /Learning-Management-System/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/lms-app/browser