name: Deploy Angular App

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: "pages"
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
environment: Development


defaults:
  run:
    working-directory: lms-app

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm
      cache-dependency-path: lms-app/package-lock.json

  - name: Setup Pages
    uses: actions/configure-pages@v5

  - name: Install Dependencies
    run: npm ci

  - name: Generate Environment File
    run: |
      cat > src/environments/environment.ts << EOF
      export const environment = {
        production: true,
        apiUrl: '${{ vars.API_URL }}',
        hubUrl: '${{ vars.HUB_URL }}',
        hangfireUrl: '${{ vars.HANGFIRE_URL }}',
        razorpayKey: '${{ secrets.RAZORPAY_KEY }}'
      };
      EOF

  - name: Build Angular App
    run: npm run build -- --configuration production --base-href /Learning-Management-System/

  - name: Verify Build Output
    run: |
      find dist -type f | head -100

  - name: Upload Artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: lms-app/dist/lms-app/browser


deploy:
needs: build
runs-on: ubuntu-latest


environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4

