name: 🚀 Deploy Backend (Docker Hub → AKS)

# ──────────────────────────────────────────────────────────────────────────────
# CONTRIBUTOR-SAFE — No ACR, no Azure role assignments required.
#
# Uses Docker Hub for container images:
#   • Build image locally in the runner
#   • Push to Docker Hub (DOCKERHUB_USERNAME/lms-api:<tag>)
#   • Deploy to AKS using a stored kubeconfig (KUBE_CONFIG_B64)
#
# Triggers on push to main when LMSApi/ or k8s manifests change.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - feature/azure_storage
    paths:
      - 'LMSApi/**'
      - 'azure/k8s/**'
      - '.github/workflows/backend_deployment.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: lms-api

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Build Docker image and push to Docker Hub.
  # ════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Image tag: sha-<short commit> ─────────────────────────────────────
      - name: Generate image tag
        id: meta
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          FULL="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:$TAG"
          echo "image_tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "full_image=$FULL"   >> "$GITHUB_OUTPUT"
          echo "**Image:** \`$FULL\`" >> "$GITHUB_STEP_SUMMARY"

      # ── Login to Docker Hub ───────────────────────────────────────────────
      # DOCKERHUB_TOKEN = Docker Hub access token (not your password).
      # Create at: hub.docker.com → Account Settings → Security → New Access Token
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Set up Docker Buildx (for multi-platform builds if needed) ─────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build and Push ─────────────────────────────────────────────────────
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: LMSApi
          file: LMSApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Deploy to AKS using stored kubeconfig.
  # No Azure SP needed — uses base64-encoded kubeconfig as a GitHub Secret.
  #
  # How to get KUBE_CONFIG_B64 (run locally once after infra deploy):
  #   az aks get-credentials --resource-group lms-rg-dev --name lms-aks-dev
  #   cat ~/.kube/config | base64 | pbcopy    # macOS — paste as GitHub Secret
  # ════════════════════════════════════════════════════════════════════════════
  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Restore kubeconfig from GitHub Secret ──────────────────────────────
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # ── Substitute placeholders in manifests ──────────────────────────────
      - name: Prepare K8s Manifests
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"

          # Replace image placeholder with real Docker Hub image + tag
          sed -i "s|<DOCKERHUB_USERNAME>|$DH_USER|g"        azure/k8s/deployment.yaml
          sed -i "s|$IMAGE_NAME:latest|$IMAGE_NAME:$TAG|g"  azure/k8s/deployment.yaml

          # Replace dynamic URL placeholders
          sed -i "s|<AKS_EXTERNAL_IP>|${{ vars.AKS_EXTERNAL_IP }}|g" azure/k8s/deployment.yaml
          sed -i "s|<SWA_HOSTNAME>|${{ vars.SWA_HOSTNAME }}|g"        azure/k8s/deployment.yaml

          # Inject UAMI client ID and Azure tenant ID
          sed -i "s|<UAMI_CLIENT_ID>|${{ secrets.UAMI_CLIENT_ID }}|g"    azure/k8s/serviceaccount.yaml
          sed -i "s|<UAMI_CLIENT_ID>|${{ secrets.UAMI_CLIENT_ID }}|g"    azure/k8s/secretproviderclass.yaml
          sed -i "s|<AZURE_TENANT_ID>|${{ secrets.AZURE_TENANT_ID }}|g"  azure/k8s/secretproviderclass.yaml

      # ── Apply all K8s manifests ────────────────────────────────────────────
      - name: Apply K8s Manifests
        run: kubectl apply -k azure/k8s/

      # ── Rolling restart ────────────────────────────────────────────────────
      - name: Rolling Restart & Wait
        run: |
          kubectl rollout restart deployment/lms-api -n lms
          kubectl rollout status deployment/lms-api -n lms --timeout=300s

      # ── Print external IP ──────────────────────────────────────────────────
      - name: Get External IP
        run: |
          echo "### ✅ Backend Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ needs.build-and-push.outputs.full_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**External IP:**" >> "$GITHUB_STEP_SUMMARY"
          kubectl get svc lms-api-svc -n lms \
            -o jsonpath='http://{.status.loadBalancer.ingress[0].ip}' \
            >> "$GITHUB_STEP_SUMMARY" || echo "(pending — check again in 1–2 min)"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> If this is the first deploy, copy the IP and set GitHub Variable **AKS_EXTERNAL_IP**, then re-run." \
            >> "$GITHUB_STEP_SUMMARY"
