apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lms-keyvault-secrets
  namespace: lms
spec:
  provider: azure
  parameters:
    # ── Key Vault identity ──────────────────────────────────────────────────
    # Replace placeholders with values from Bicep outputs
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<UAMI_CLIENT_ID>"          # output: uamiClientId
    keyvaultName: "<KEY_VAULT_NAME>"           # dynamically replaced in workflow
    tenantId: "<AZURE_TENANT_ID>"         # your Azure AD tenant ID

    # ── Secrets to pull from Key Vault ─────────────────────────────────────
    # objectName  = Key Vault secret name
    # alias       = name of the env var / file that the pod will see
    objects: |
      array:
        - |
          objectName: Cloudinary--CloudName
          objectType: secret
          alias: Cloudinary__CloudName
        - |
          objectName: Cloudinary--ApiKey
          objectType: secret
          alias: Cloudinary__ApiKey
        - |
          objectName: Cloudinary--ApiSecret
          objectType: secret
          alias: Cloudinary__ApiSecret
        - |
          objectName: AzureBlob--ConnectionString
          objectType: secret
          alias: AzureBlob__ConnectionString
        - |
          objectName: Smtp--Username
          objectType: secret
          alias: Smtp__Username
        - |
          objectName: Smtp--Password
          objectType: secret
          alias: Smtp__Password
        - |
          objectName: Jwt--Key
          objectType: secret
          alias: Jwt__Key
        - |
          objectName: ConnectionStrings--DefaultConnection
          objectType: secret
          alias: ConnectionStrings__DefaultConnection
        - |
          objectName: Razorpay--KeyId
          objectType: secret
          alias: Razorpay__KeyId
        - |
          objectName: Razorpay--KeySecret
          objectType: secret
          alias: Razorpay__KeySecret
        - |
          objectName: Razorpay--WebhookSecret
          objectType: secret
          alias: Razorpay__WebhookSecret
        - |
          objectName: Stripe--SecretKey
          objectType: secret
          alias: Stripe__SecretKey
        - |
          objectName: Redis--ConnectionString
          objectType: secret
          alias: Redis__ConnectionString

        # ── AI Engine secrets ─────────────────────────────────────────────
        - |
          objectName: Groq--ApiKey
          objectType: secret
          alias: GROQ_API_KEY
        - |
          objectName: InternalApiKey
          objectType: secret
          alias: INTERNAL_API_KEY

  # Sync KV secrets → a Kubernetes Secret object so we can use envFrom
  secretObjects:
    - secretName: lms-kv-secrets
      type: Opaque
      data:
        - objectName: Cloudinary--CloudName
          key: Cloudinary__CloudName
        - objectName: Cloudinary--ApiKey
          key: Cloudinary__ApiKey
        - objectName: Cloudinary--ApiSecret
          key: Cloudinary__ApiSecret
        - objectName: AzureBlob--ConnectionString
          key: AzureBlob__ConnectionString
        - objectName: Smtp--Username
          key: Smtp__Username
        - objectName: Smtp--Password
          key: Smtp__Password
        - objectName: Jwt--Key
          key: Jwt__Key
        - objectName: ConnectionStrings--DefaultConnection
          key: ConnectionStrings__DefaultConnection
        - objectName: Razorpay--KeyId
          key: Razorpay__KeyId
        - objectName: Razorpay--KeySecret
          key: Razorpay__KeySecret
        - objectName: Razorpay--WebhookSecret
          key: Razorpay__WebhookSecret
        - objectName: Stripe--SecretKey
          key: Stripe__SecretKey
        - objectName: Redis--ConnectionString
          key: Redis__ConnectionString

  # ── AI Engine secrets → separate K8s Secret ──────────────────────────────
  # The AI engine reads GROQ_API_KEY and INTERNAL_API_KEY via envFrom.
    - secretName: lms-ai-engine-secrets
      type: Opaque
      data:
        - objectName: Groq--ApiKey
          key: GROQ_API_KEY
        - objectName: InternalApiKey
          key: INTERNAL_API_KEY
