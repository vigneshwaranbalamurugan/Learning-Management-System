apiVersion: v1
kind: Service
metadata:
  name: lms-ai-engine-svc
  namespace: lms
  labels:
    app: lms-ai-engine
spec:
  # ClusterIP = internal-only. The AI engine is NEVER exposed publicly.
  # The .NET LMSApi calls it via: http://lms-ai-engine-svc/
  type: ClusterIP
  selector:
    app: lms-ai-engine
  ports:
    - name: http
      port: 80
      targetPort: 8001
      protocol: TCP
