apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lms-ai-engine-chroma-pvc
  namespace: lms
  labels:
    app: lms-ai-engine
spec:
  # Azure Managed Disk (ReadWriteOnce — single node, sufficient for 1 replica)
  storageClassName: managed-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 1 Gi is sufficient for dev/test; resize (with brief downtime) as needed.
      # To resize: update this value + run: kubectl apply -f ai-engine-pvc.yaml
      storage: 1Gi
