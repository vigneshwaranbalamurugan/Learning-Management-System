apiVersion: v1
kind: ServiceAccount
metadata:
  name: lms-workload-sa
  namespace: lms
  annotations:
    # ── Workload Identity annotation ────────────────────────────────────────
    # Replace <UAMI_CLIENT_ID> with the value of `uamiClientId` output from
    # `az deployment group show ... --query properties.outputs.uamiClientId.value`
    azure.workload.identity/client-id: "<UAMI_CLIENT_ID>"
labels:
  azure.workload.identity/use: "true"
